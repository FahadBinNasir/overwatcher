<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Central Target Reticle Background -->
  <g transform="translate(640, 240)" opacity="0.25">
    <circle r="180" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle r="130" fill="none" stroke="#60a5fa" stroke-width="1"/>
    <circle r="80" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Overwatcher Logo Icon -->
  <g transform="translate(640, 165)">
    <circle cx="0" cy="0" r="48" fill="#111827" stroke="url(#blueGlow)" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <path d="M -34 0 C -26 -16 26 -16 34 0 C 26 16 -26 16 -34 0 Z" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <line x1="0" y1="-48" x2="0" y2="-32" stroke="#60a5fa" stroke-width="3"/>
    <line x1="0" y1="32" x2="0" y2="48" stroke="#60a5fa" stroke-width="3"/>
    <line x1="-48" y1="0" x2="-32" y2="0" stroke="#60a5fa" stroke-width="3"/>
    <line x1="32" y1="0" x2="48" y2="0" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <!-- Typography -->
  <text x="640" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">OVERWATCHER</text>
  <text x="640" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">Hierarchical Multi-Agent Supervisor &amp; Adversarial Cross-Examiner</text>

  <!-- Feature Pills -->
  <g transform="translate(640, 420)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Anti-Vibe-Check Verification</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Disjoint Boundary Contracts</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(320, 0)">
      <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Deterministic Proof</text>
    </g>
  </g>

  <!-- Footer Meta -->
  <text x="640" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">github.com/FahadBinNasir/overwatcher · Open Source MIT</text>
</svg>
