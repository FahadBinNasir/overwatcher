name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run verification tests
      run: |
        python tests/test_cross_examiner.py

    - name: Package skill bundle
      run: |
        TAG_NAME="${{ github.ref_name || inputs.tag_name }}"
        mkdir -p dist
        tar -czvf "dist/overwatcher-${TAG_NAME}.tar.gz" SKILL.md templates/ scripts/ examples/ assets/ LICENSE README.md
        zip -r "dist/overwatcher-${TAG_NAME}.zip" SKILL.md templates/ scripts/ examples/ assets/ LICENSE README.md

    - name: Prepare Release Notes
      run: |
        TAG_NAME="${{ github.ref_name || inputs.tag_name }}"
        if [ -f "RELEASE_NOTES_${TAG_NAME}.md" ]; then
          cp "RELEASE_NOTES_${TAG_NAME}.md" release_notes.md
        else
          cp CHANGELOG.md release_notes.md
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || inputs.tag_name }}
        name: "Release ${{ github.ref_name || inputs.tag_name }}"
        body_path: release_notes.md
        files: |
          dist/overwatcher-*.tar.gz
          dist/overwatcher-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
