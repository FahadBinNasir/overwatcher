name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build distribution and publish to PyPI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Run verification test suite
      run: |
        python tests/test_cross_examiner.py

    - name: Build sdist and wheel
      run: |
        python -m build

    - name: Check package distribution
      run: |
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
      # Supports PyPI Trusted Publishing (OIDC) automatically.
      # If using an API token instead, configure PYPI_API_TOKEN in repository secrets.
